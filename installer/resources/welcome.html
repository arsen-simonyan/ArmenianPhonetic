<h1>Armenian Phonetic</h1>
<p>Հայերենի հնչյունային մուտքագրում macOS-ի համար՝ լայն <strong>HY</strong> նշանով։</p>
<p>Տեղադրիչը հավելվածը կտեղադրի միայն ընթացիկ օգտվողի համար՝ այս պանակում․</p>
<p><code>~/Library/Input Methods/Armenian Phonetic.app</code></p>
<p>Պահանջվում է Apple Silicon համակարգիչ և macOS 27.0 կամ ավելի նոր տարբերակ։</p>
</body></html>
