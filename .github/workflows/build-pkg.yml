name: PKG-ի կառուցում

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Armenian Phonetic · arm64
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Սկզբնական կոդի ստացում
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Թեգի տարբերակի ստուգում
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            printf '%s\n' "Թեգը պետք է լինի v$VERSION, ստացվել է՝ $RELEASE_TAG"
            exit 1
          fi

      - name: PKG տեղադրիչի կառուցում
        run: ./scripts/package.sh

      - name: PKG ֆայլի պահպանում
        uses: actions/upload-artifact@v7
        with:
          path: dist/ArmenianPhonetic-*-arm64.pkg
          archive: false
          if-no-files-found: error

  release:
    name: Թողարկման հրապարակում
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: PKG ֆայլի ներբեռնում
        uses: actions/download-artifact@v8
        with:
          pattern: ArmenianPhonetic-*-arm64.pkg
          path: dist
          merge-multiple: true

      - name: GitHub Release-ի ստեղծում
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PKG_PATH="dist/ArmenianPhonetic-${RELEASE_TAG#v}-arm64.pkg"
          test -f "$PKG_PATH"
          printf '%s\n' \
            'Հայերենի հնչյունային մուտքագրում macOS-ի համար՝ լայն **HY** նշանով։' \
            '' \
            'Պահանջվում է Apple Silicon (`arm64`) և macOS 27.0 կամ ավելի նոր տարբերակ։' \
            '' \
            'Ներբեռնեք կցված PKG տեղադրիչը։' > release-notes.md
          gh release create "$RELEASE_TAG" "$PKG_PATH" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Armenian Phonetic ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
